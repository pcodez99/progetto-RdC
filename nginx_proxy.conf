# Progetto 11 - NGINX Reverse Proxy Configuration
# Eseguito sul nodo PROXY (10.0.1.3)
# Reverse proxy verso S1 (10.0.1.2:5001) e S2 (10.0.1.4:5002)
#
# Accesso:
#   http://10.0.1.3/s1/api/...  ->  http://10.0.1.2:5001/api/...
#   http://10.0.1.3/s2/api/...  ->  http://10.0.1.4:5002/api/...
#
# L'accesso e' consentito solo da VLAN1 (192.168.1.0/24) tramite iptables

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log;

events {
    worker_connections 128;
}

http {
    access_log /tmp/nginx_access.log;

    # Temp paths per eseguire senza root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    upstream s1_backend {
        server 10.0.1.2:5001;
    }

    upstream s2_backend {
        server 10.0.1.4:5002;
    }

    server {
        listen 80;
        server_name _;

        # Timeout piu lunghi per i test iperf (possono durare anche 60s+)
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;

        # Root: status page
        location = / {
            default_type application/json;
            return 200 '{"service": "PROXY", "status": "running", "backends": ["s1", "s2"]}';
        }

        # Reverse proxy verso S1
        location /s1/ {
            proxy_pass http://s1_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Reverse proxy verso S2
        location /s2/ {
            proxy_pass http://s2_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
